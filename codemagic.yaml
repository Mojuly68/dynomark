# Codemagic cloud build: DYNOMARK for iPhone, uploaded to TestFlight.
# Runs on a Codemagic Mac, so no Mac is needed here. Start it by hand from the Codemagic dashboard.
# Before the first run, add the App Store Connect API key in Codemagic under the name below (see TESTFLIGHT.md).
workflows:
  ios-testflight:
    name: DYNOMARK iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Must match the name of the App Store Connect API key in Codemagic (Settings → Integrations → Developer Portal).
      app_store_connect: DYNOMARK
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.studiovektor.dynomark
      vars:
        # The app's Apple ID: App Store Connect → DYNOMARK → App Information → Apple ID.
        APP_STORE_APPLE_ID: 6838461384
        # RevenueCat public SDK key for iOS (starts with "appl_"; public by design, safe to commit).
        # Set = Pro purchases on (from 1.1). Empty = everything free with no paywall (the 1.0 behaviour, tag v1.0).
        # Key of RevenueCat project "Dynomark", app "DYNOMARK (App Store)".
        VITE_RC_APPLE_KEY: appl_ZhTaiSwVBGVrbVfnssnIpxkPgKl
        # Crew (1.3): Supabase project URL + anon key (both public by design; row-level security protects the data).
        # Empty = no Crew tab in the store app. See CREW-SETUP.md.
        VITE_SUPABASE_URL: https://eiiisquvxaveefwdzqyq.supabase.co
        VITE_SUPABASE_ANON_KEY: sb_publishable_ayPPdJ9E82lWdZRgeuL-Pw_xZi4CIR1
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: npm ci
      - name: Build the web app (store build, Pro testing switch off)
        script: VITE_PRO_PREVIEW=false npm run build
      - name: Copy it into the iOS app
        script: npx cap sync ios
      - name: Use the signing files Codemagic fetched
        script: xcode-project use-profiles
      - name: Next build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build the iPhone app
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers (group "Climbers") get every build automatically. External beta review would need
        # TestFlight Test Information filled in, so it stays off.
        submit_to_testflight: false
